name: Setup Waypoint
description: pnpm + Node + dependencies + a CI .env.local, and optionally the PocketBase binary.

inputs:
  node-version:
    description: Node major version
    required: false
    default: '22'
  pocketbase:
    description: Set to 'true' to fetch (and cache) the PocketBase binary.
    required: false
    default: 'false'
  pocketbase-version:
    description: PocketBase version to fetch when `pocketbase` is true.
    required: false
    # Quoted deliberately: an unquoted single-dot version (1.30) is parsed as
    # the float 1.3 and silently corrupts the download URL.
    default: '0.27.2'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    # EVERY job needs this, not just the ones that start a server: `pnpm check`
    # runs `svelte-kit sync`, which generates the `$env/static/public` types
    # from the loaded env. Without PUBLIC_PB_URL present at sync time the
    # generated module has no such export and svelte-check reports 11 errors in
    # 11 files that are perfectly fine — which is exactly how the first CI run
    # failed. .env.local is gitignored, so CI has to write its own.
    #
    # No real secrets are needed: dev mode disables SMTP and rate limits, and
    # nothing in CI touches the Maps or AeroDataBox keys.
    - name: Write CI .env.local
      shell: bash
      run: |
        cat > .env.local <<'EOF'
        PUBLIC_PB_URL=http://127.0.0.1:8090
        PUBLIC_APP_URL=http://127.0.0.1:5173
        WAYPOINT_DEV_MODE=true
        E2E_TEST_EMAIL=e2e@waypoint.local
        E2E_TEST_EMAILS=rules-owner@e2e.test,rules-coowner@e2e.test,rules-traveler@e2e.test,rules-viewer@e2e.test,rules-nonmember@e2e.test,e2e@waypoint.local
        EOF

    # backend/pocketbase is gitignored (31MB), so CI fetches it. The version
    # must match the binary used locally and on basecamp — the hooks target
    # this JSVM.
    - name: Cache PocketBase binary
      if: inputs.pocketbase == 'true'
      id: pb-cache
      uses: actions/cache@v4
      with:
        path: backend/pocketbase
        key: pocketbase-${{ inputs.pocketbase-version }}-linux-amd64

    - name: Download PocketBase
      if: inputs.pocketbase == 'true' && steps.pb-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PB_VERSION: ${{ inputs.pocketbase-version }}
      run: |
        curl -sSL -o /tmp/pb.zip \
          "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
        unzip -o -q /tmp/pb.zip -d /tmp/pb
        install -m 0755 /tmp/pb/pocketbase backend/pocketbase
        backend/pocketbase --version
